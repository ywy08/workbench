<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#556B2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-touch-icon" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23556B2F'/%3E%3Ctext x='50' y='68' font-size='50' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'%3E工%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23556B2F'/%3E%3Ctext x='50' y='68' font-size='50' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'%3E工%3C/text%3E%3C/svg%3E">
<title>工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#556B2F;--primary-light:#7BA05B;--primary-dark:#3F4F22;--bg:#f5f7f0;--card:#fff;--text:#2d3b1f;--text-secondary:#6b7560;--border:#e5e8dd;--shadow:0 2px 12px rgba(85,107,47,0.08);--radius:16px}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
body{display:flex;flex-direction:column}
.app-header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--primary);color:#fff;display:flex;align-items:center;padding:0 16px;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.menu-btn{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:8px;margin-right:12px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app-title{font-size:17px;font-weight:600;flex:1}
.date-display{font-size:13px;opacity:0.85}
.drawer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:200;opacity:0;visibility:hidden;transition:all 0.3s;pointer-events:none}
.drawer-overlay.active{opacity:1;visibility:visible;pointer-events:auto}
.drawer{position:fixed;top:0;left:-280px;bottom:0;width:260px;background:#fff;z-index:300;transition:left 0.3s ease;display:flex;flex-direction:column;box-shadow:2px 0 20px rgba(0,0,0,0.1)}
.drawer.active{left:0}
.drawer-header{padding:24px 20px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff}
.drawer-header h2{font-size:20px;margin-bottom:4px}
.drawer-header p{font-size:13px;opacity:0.9}
.drawer-user{display:flex;align-items:center;margin-bottom:10px}
.drawer-avatar{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;margin-right:12px}
.drawer-user-info{flex:1;min-width:0}
.drawer-name{font-size:16px;font-weight:600}
.drawer-date{font-size:12px;opacity:0.85}
.drawer-quote{font-size:12px;opacity:0.9;line-height:1.4;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.2)}
.drawer-quote-text{font-style:italic}
.drawer-quote-author{font-size:11px;opacity:0.75;text-align:right;margin-top:4px}
.drawer-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;padding:12px 16px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:14px;color:var(--text);transition:all 0.2s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(85,107,47,0.05)}
.nav-item.active{background:rgba(85,107,47,0.1);border-left-color:var(--primary);color:var(--primary-dark);font-weight:500}
.nav-icon{font-size:18px;margin-right:12px;width:24px;text-align:center}
.quote-manage-btn{background:none;border:none;color:rgba(255,255,255,0.7);font-size:11px;cursor:pointer;margin-top:6px;padding:0;text-align:right;width:100%}
.quote-manage-btn:active{color:#fff}
.main{flex:1;margin-top:56px;padding:16px;padding-bottom:80px}
.module{display:none;animation:fadeIn 0.3s}
.module.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card-title .icon{font-size:18px;margin-right:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:10px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-dark)}
.btn-secondary{background:rgba(85,107,47,0.1);color:var(--primary)}
.btn-secondary:active{background:rgba(85,107,47,0.2)}
.btn-danger{background:#fee;color:#d44}
.btn-block{width:100%}
.btn-small{padding:6px 12px;font-size:12px}
.input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:#fafbf7;transition:border-color 0.2s}
.input:focus{outline:none;border-color:var(--primary)}
.textarea{min-height:80px;resize:vertical;font-family:inherit}
.task-item{display:flex;align-items:center;padding:12px;background:#fafbf7;border-radius:12px;margin-bottom:8px;transition:background 0.2s}
.task-item:hover{background:#f0f3e8}
.task-checkbox{width:22px;height:22px;margin-right:12px;accent-color:var(--primary);cursor:pointer}
.task-text{flex:1;font-size:14px}
.task-done{text-decoration:line-through;color:var(--text-secondary)}
.task-delete{background:none;border:none;color:#d44;font-size:18px;cursor:pointer;padding:4px 8px}
.progress-bar{width:100%;height:8px;background:#e5e8dd;border-radius:4px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:4px;transition:width 0.3s}
.progress-text{font-size:13px;color:var(--text-secondary);text-align:center;margin-top:4px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;margin:2px;background:rgba(85,107,47,0.1);color:var(--primary)}
.tag-red{background:rgba(200,50,50,0.1);color:#c83232}
.tag-blue{background:rgba(50,100,200,0.1);color:#3264c8}
.tag-orange{background:rgba(200,120,30,0.1);color:#c8781e}
.tag-purple{background:rgba(120,50,200,0.1);color:#7832c8}
.inspiration-item{padding:14px;background:linear-gradient(135deg,#f8faf4,#f0f3e8);border-radius:12px;margin-bottom:12px;border-left:4px solid var(--primary)}
.inspiration-title{font-size:15px;font-weight:600;margin-bottom:6px}
.inspiration-desc{font-size:13px;color:var(--text-secondary);margin-bottom:8px;line-height:1.5}
.inspiration-actions{display:flex;gap:8px}
.video-btn{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:8px;border:none;font-size:12px;font-weight:500;cursor:pointer}
.douyin-btn{background:#000;color:#fff}
.bilibili-btn{background:#fb7299;color:#fff}
.memo-item{display:flex;align-items:center;padding:10px;background:#fafbf7;border-radius:10px;margin-bottom:6px}
.memo-checkbox{margin-right:10px;accent-color:var(--primary)}
.memo-text{flex:1;font-size:14px;background:none;border:none;outline:none}
.memo-text.done{text-decoration:line-through;color:var(--text-secondary)}
.stat-row{display:flex;gap:10px;margin-bottom:12px}
.stat-box{flex:1;padding:12px;background:linear-gradient(135deg,#f8faf4,#f0f3e8);border-radius:12px;text-align:center}
.stat-value{font-size:20px;font-weight:700;color:var(--primary)}
.stat-label{font-size:12px;color:var(--text-secondary);margin-top:4px}
.tab-bar{display:flex;background:#e5e8dd;border-radius:10px;padding:4px;margin-bottom:16px}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;background:none;border:none;color:var(--text-secondary);transition:all 0.2s}
.tab.active{background:var(--card);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.news-item{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:10px}
.news-item:last-child{border-bottom:none}
.news-source{width:50px;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;flex-shrink:0}
.news-content{flex:1;min-width:0}
.news-title{font-size:14px;font-weight:500;margin-bottom:4px;line-height:1.4}
.news-meta{font-size:12px;color:var(--text-secondary)}
.news-link{text-decoration:none;color:inherit}
.stock-card{padding:14px;background:linear-gradient(135deg,#fff,#f8faf4);border-radius:12px;margin-bottom:10px}
.stock-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stock-name{font-size:15px;font-weight:600}
.stock-price{font-size:18px;font-weight:700}
.stock-change{font-size:13px;padding:3px 8px;border-radius:6px}
.stock-up{color:#d44}
.stock-down{color:#4a4}
.section-header{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}
.section-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:16px;background:var(--primary);border-radius:2px}
.refresh-btn{background:none;border:none;color:var(--primary);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:6px 12px}
.refresh-btn:active{opacity:0.7}
.reading-book{padding:14px;background:linear-gradient(135deg,#f8faf4,#f0f3e8);border-radius:12px;margin-bottom:12px}
.book-header{display:flex;gap:12px;margin-bottom:10px}
.book-cover{width:50px;height:70px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;text-align:center;padding:4px}
.book-info{flex:1}
.book-title{font-size:15px;font-weight:600;margin-bottom:4px}
.book-progress{font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.book-progress-bar{height:6px;background:#e5e8dd;border-radius:3px;margin-top:6px;overflow:hidden}
.book-progress-fill{height:100%;background:var(--primary);border-radius:3px}
.chapter-list{margin-top:10px}
.chapter-item{display:flex;align-items:center;padding:8px;background:#fff;border-radius:8px;margin-bottom:6px;font-size:13px}
.chapter-type{padding:2px 8px;border-radius:4px;font-size:11px;margin-right:8px}
.chapter-intensive{background:rgba(200,50,50,0.1);color:#c83232}
.chapter-extensive{background:rgba(50,100,200,0.1);color:#3264c8}
.chapter-name{flex:1}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-secondary)}
.empty-state .icon{font-size:48px;margin-bottom:12px;opacity:0.5}
.floating-btn{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:28px;box-shadow:0 4px 20px rgba(85,107,47,0.3);cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}
.floating-btn:active{transform:scale(0.95)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.video-item{padding:12px;background:#fafbf7;border-radius:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.video-icon{font-size:20px}
.video-info{flex:1;min-width:0}
.video-title{font-size:14px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-source{font-size:12px;color:var(--text-secondary)}
.video-play-btn{padding:6px 12px;border-radius:8px;border:none;font-size:12px;font-weight:500;cursor:pointer}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:400;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}
.counter-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:rgba(85,107,47,0.1);color:var(--primary);border:none;font-size:16px;cursor:pointer}
.counter-btn:active{background:rgba(85,107,47,0.2)}
.streak-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:linear-gradient(135deg,#ff9a00,#ff6a00);color:#fff;border-radius:12px;font-size:12px;font-weight:500}
.heat-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:12px 0}
.heat-day{aspect-ratio:1;border-radius:4px;background:#e5e8dd;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-secondary)}
.heat-day.active{background:var(--primary);color:#fff}
.heat-day.today{border:2px solid var(--primary-dark)}
.heat-day.checked{background:var(--primary-light)}
.heat-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-bottom:6px}
.quote-card{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.quote-card::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:rgba(255,255,255,0.1);border-radius:50%}
.quote-card::after{content:'';position:absolute;bottom:-20px;left:-20px;width:60px;height:60px;background:rgba(255,255,255,0.08);border-radius:50%}
.quote-content{position:relative;z-index:1}
.quote-mark{font-size:32px;opacity:0.5;line-height:0;margin-bottom:8px}
.quote-text{font-size:16px;font-weight:500;line-height:1.6;margin-bottom:12px}
.quote-author{font-size:13px;opacity:0.85;text-align:right}
.quote-actions{display:flex;gap:8px;margin-top:16px}
.quote-btn{background:rgba(255,255,255,0.2);color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px}
.quote-btn:active{background:rgba(255,255,255,0.3)}
.quote-manage-item{display:flex;align-items:center;padding:12px;background:#fafbf7;border-radius:10px;margin-bottom:8px;gap:10px}
.quote-manage-text{flex:1;font-size:14px;line-height:1.4}
@media(min-width:768px){
.main{max-width:600px;margin:56px auto 0}
.drawer{width:280px}
}
</style>
</head>
<body>
<header class="app-header">
<button class="menu-btn" id="menuBtn">☰</button>
<div class="app-title" id="appTitle">工作台</div>
<div class="date-display" id="dateDisplay"></div>
</header>
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<nav class="drawer" id="drawer">
<div class="drawer-header">
<div class="drawer-user">
<div class="drawer-avatar">我</div>
<div class="drawer-user-info">
<div class="drawer-name">工作台</div>
<div class="drawer-date" id="userDate"></div>
</div>
</div>
<div class="drawer-quote" style="cursor:pointer" onclick="editCurrentQuote()">
<div class="drawer-quote-text" id="drawerQuoteText">加载中...</div>
<div class="drawer-quote-author" id="drawerQuoteAuthor"></div>
<div style="font-size:10px;opacity:0.6;margin-top:4px;text-align:right">点击编辑</div>
</div>
</div>
<div class="drawer-nav" id="drawerNav">
<button class="nav-item active" data-module="plan"><span class="nav-icon">📋</span>每日计划</button>
<button class="nav-item" data-module="inspiration"><span class="nav-icon">💡</span>选题灵感</button>
<button class="nav-item" data-module="remix"><span class="nav-icon">🎬</span>二创方向</button>
<button class="nav-item" data-module="review"><span class="nav-icon">📊</span>内容复盘</button>
<button class="nav-item" data-module="create"><span class="nav-icon">✍️</span>创作打卡</button>
<button class="nav-item" data-module="frontend"><span class="nav-icon">💻</span>每日前端</button>
<button class="nav-item" data-module="exercise"><span class="nav-icon">🏋️</span>每日锻炼</button>
<button class="nav-item" data-module="stock"><span class="nav-icon">📈</span>股票基金</button>
<button class="nav-item" data-module="reading"><span class="nav-icon">📚</span>每日阅读</button>
</div>
<div style="padding:12px;border-top:1px solid var(--border)">
<button class="btn btn-secondary btn-block" onclick="showSyncMenu()">☁️ 云端同步</button>
</div>
</nav>
<main class="main">
<section class="module active" id="module-plan">
<div class="card">
<div class="card-title"><span><span class="icon">📋</span>每日计划</span><span id="planStreak" class="streak-badge"></span></div>
<div class="progress-bar"><div class="progress-fill" id="planProgress"></div></div>
<div class="progress-text" id="planProgressText">0 / 0 完成</div>
<div style="display:flex;gap:8px;margin-top:12px">
<input class="input" id="newTaskInput" placeholder="添加新任务..." onkeydown="if(event.key==='Enter')addTask()">
<button class="btn btn-primary" onclick="addTask()">＋</button>
</div>
</div>
<div class="card">
<div class="card-title"><span>📝 任务列表</span><button class="btn btn-secondary btn-small" onclick="showPullPlanDialog()">🔄 拉取计划</button></div>
<div id="taskList"></div>
</div>
</section>
<section class="module" id="module-inspiration">
<div class="card">
<div class="card-title"><span><span class="icon">💡</span>每日选题灵感</span><button class="refresh-btn" onclick="refreshInspiration()">🔄 刷新</button></div>
<div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">每日精选 10 条选题，点击按钮唤起抖音/B站 App</div>
<div id="inspirationList"></div>
</div>
</section>
<section class="module" id="module-remix">
<div class="card">
<div class="card-title"><span><span class="icon">🎬</span>爆款热点视频二创</span><button class="refresh-btn" onclick="refreshRemix()">🔄 刷新</button></div>
<div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">聚合当日热点素材，输出二创方向</div>
<div id="remixList"></div>
</div>
</section>
<section class="module" id="module-review">
<div class="tab-bar">
<button class="tab active" onclick="switchReviewTab(event,'content')">内容复盘</button>
<button class="tab" onclick="switchReviewTab(event,'memo')">备忘录</button>
</div>
<div id="reviewContent">
<div class="card">
<div class="card-title"><span>📊 内容数据复盘</span></div>
<div class="stat-row">
<div class="stat-box"><div class="stat-value" id="statPlays">0</div><div class="stat-label">播放量</div></div>
<div class="stat-box"><div class="stat-value" id="statLikes">0</div><div class="stat-label">点赞</div></div>
<div class="stat-box"><div class="stat-value" id="statComments">0</div><div class="stat-label">评论</div></div>
<div class="stat-box"><div class="stat-value" id="statShares">0</div><div class="stat-label">转发</div></div>
</div>
<div style="display:flex;gap:8px;margin-bottom:12px">
<input class="input" id="inputPlays" placeholder="播放量" type="number">
<input class="input" id="inputLikes" placeholder="点赞" type="number">
</div>
<div style="display:flex;gap:8px;margin-bottom:12px">
<input class="input" id="inputComments" placeholder="评论" type="number">
<input class="input" id="inputShares" placeholder="转发" type="number">
</div>
<button class="btn btn-primary btn-block" onclick="saveReviewData()">💾 保存数据</button>
</div>
<div class="card">
<div class="card-title"><span>✨ 作品亮点</span></div>
<textarea class="input textarea" id="reviewHighlights" placeholder="记录视频的亮点、吸引人的地方..."></textarea>
</div>
<div class="card">
<div class="card-title"><span>⚠️ 存在问题</span></div>
<textarea class="input textarea" id="reviewIssues" placeholder="分析视频存在的问题和不足..."></textarea>
</div>
<div class="card">
<div class="card-title"><span>🚀 后续优化方案</span></div>
<textarea class="input textarea" id="reviewOptimizations" placeholder="下一步如何改进和优化..."></textarea>
</div>
<button class="btn btn-primary btn-block" onclick="saveReviewAll()" style="margin-bottom:20px">💾 保存复盘</button>
</div>
<div id="reviewMemo" style="display:none">
<div class="card">

function $(id){return document.getElementById(id)}
function getStorage(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def}catch(e){return def}}
function setStorage(key,val){localStorage.setItem(key,JSON.stringify(val))}

function initDate(){const d=new Date();const w=['日','一','二','三','四','五','六'];$('dateDisplay').textContent=`${d.getMonth()+1}/${d.getDate()} 周${w[d.getDay()]}`;$('userDate').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}

window.toggleDrawer=function(){$('drawer').classList.toggle('active');$('drawerOverlay').classList.toggle('active')}

function initDrawerEvents(){const menuBtn=$('menuBtn');const overlay=$('drawerOverlay');if(menuBtn){menuBtn.addEventListener('click',function(e){e.preventDefault();toggleDrawer()});menuBtn.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();toggleDrawer()},{passive:false})}if(overlay){overlay.addEventListener('click',function(e){e.preventDefault();toggleDrawer()});overlay.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();toggleDrawer()},{passive:false})}}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initDrawerEvents)}else{initDrawerEvents()}

function switchModule(name){document.querySelectorAll('.module').forEach(m=>m.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));$('module-'+name).classList.add('active');document.querySelector(`.nav-item[data-module="${name}"]`).classList.add('active');$('drawer').classList.remove('active');$('drawerOverlay').classList.remove('active');const titles={plan:'每日计划',inspiration:'选题灵感',remix:'二创方向',review:'内容复盘',create:'创作打卡',frontend:'每日前端',exercise:'每日锻炼',stock:'股票基金',reading:'每日阅读'};$('appTitle').textContent=titles[name]||'日常工作台'}

document.querySelectorAll('.nav-item').forEach(item=>item.addEventListener('click',()=>switchModule(item.dataset.module)))

function renderPlan(){let tasks=getStorage(STORAGE_KEYS.tasks,[]);const today=new Date().toDateString();if(!Array.isArray(tasks))tasks=[];let validTasks=tasks.filter(t=>t.date===today);let otherTasks=tasks.filter(t=>t.date!==today);if(validTasks.length===0&&tasks.length>0){$('taskList').innerHTML='<div class="empty-state"><div class="icon">📋</div><p>今日还没有计划任务</p></div>'}else{let doneCount=validTasks.filter(t=>t.done).length;let total=validTasks.length;let pct=total?Math.round(doneCount/total*100):0;$('planProgress').style.width=pct+'%';$('planProgressText').textContent=`${doneCount} / ${total} 完成 (${pct}%)`;let html=validTasks.map((t,i)=>`<div class="task-item"><input type="checkbox" class="task-checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})"><span class="task-text ${t.done?'task-done':''}">${escapeHtml(t.text)}</span><button class="task-delete" onclick="deleteTask(${i})">✕</button></div>`).join('');$('taskList').innerHTML=html}}function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function addTask(){const input=$('newTaskInput');const text=input.value.trim();if(!text)return;let tasks=getStorage(STORAGE_KEYS.tasks,[]);const today=new Date().toDateString();tasks.push({text,done:false,date:today,createdAt:Date.now()});setStorage(STORAGE_KEYS.tasks,tasks);input.value='';renderPlan()}

function toggleTask(i){let tasks=getStorage(STORAGE_KEYS.tasks,[]);const today=new Date().toDateString();let validTasks=tasks.filter(t=>t.date===today);let otherTasks=tasks.filter(t=>t.date!==today);validTasks[i].done=!validTasks[i].done;tasks=[...otherTasks,...validTasks];setStorage(STORAGE_KEYS.tasks,tasks);renderPlan()}

function deleteTask(i){let tasks=getStorage(STORAGE_KEYS.tasks,[]);const today=new Date().toDateString();let validTasks=tasks.filter(t=>t.date===today);let otherTasks=tasks.filter(t=>t.date!==today);validTasks.splice(i,1);tasks=[...otherTasks,...validTasks];setStorage(STORAGE_KEYS.tasks,tasks);renderPlan()}

function showPullPlanDialog(){const modal=$('modalOverlay');const content=$('modalContent');content.innerHTML=`<div class="modal-title">🔄 从其他模块拉取计划</div><p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px">选择要拉取的模块，将自动添加相关计划到今日任务</p><button class="btn btn-secondary btn-block" style="margin-bottom:8px" onclick="pullFromModule('frontend')">💻 从「每日前端」拉取</button><button class="btn btn-secondary btn-block" style="margin-bottom:8px" onclick="pullFromModule('exercise')">🏋️ 从「每日锻炼」拉取</button><button class="btn btn-secondary btn-block" style="margin-bottom:8px" onclick="pullFromModule('reading')">📚 从「每日阅读」拉取</button><button class="btn btn btn-block" onclick="closeModal()">取消</button>`;modal.classList.add('active')}

function pullFromModule(type){const today=new Date().toDateString();let templates={frontend:'学习前端技术资讯',exercise:'完成每日锻炼',reading:'完成今日阅读'};let tasks=getStorage(STORAGE_KEYS.tasks,[]);let validTasks=tasks.filter(t=>t.date===today);const template=templates[type];const exists=validTasks.find(t=>t.text===template);if(exists){alert('该计划已存在');closeModal();return}validTasks.push({text:template,done:false,date:today,createdAt:Date.now()});tasks=[...tasks.filter(t=>t.date!==today),...validTasks];setStorage(STORAGE_KEYS.tasks,tasks);closeModal();renderPlan();alert('已添加到今日计划！')}

async function fetchHotDataFromRepo(){try{const resp=await fetch(`https://raw.githubusercontent.com/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/${REPO_CONFIG.branch}/${REPO_CONFIG.hotFile}`);if(resp.ok){return await resp.json()}}catch(e){console.log('fetchHotDataFromRepo error:',e.message)}return null}

async function refreshInspiration(e){const btn=e&&e.target?e.target:document.activeElement;if(!btn)return;const origText=btn.textContent;btn.textContent='⏳ 加载中...';btn.disabled=true;try{const data=await fetchHotDataFromRepo();if(data&&data.inspiration){setStorage('wb_inspiration_cache',data.inspiration);renderInspiration();const time=data.updatedAtCN?`（${data.updatedAtCN} 更新）`:'';alert(`✅ 灵感已刷新！${time}`)}else{renderInspiration();alert('暂无云端数据，使用本地默认')}}catch(err){console.log('refreshInspiration error:',err);renderInspiration();alert('刷新失败，使用本地默认')}finally{btn.textContent=origText;btn.disabled=false}}

async function refreshRemix(e){const btn=e&&e.target?e.target:document.activeElement;if(!btn)return;const origText=btn.textContent;btn.textContent='⏳ 加载中...';btn.disabled=true;try{const data=await fetchHotDataFromRepo();if(data&&data.remix){setStorage('wb_remix_cache',data.remix);renderRemix();const time=data.updatedAtCN?`（${data.updatedAtCN} 更新）`:'';alert(`✅ 二创方向已刷新！${time}`)}else{renderRemix();alert('暂无云端数据，使用本地默认')}}catch(err){console.log('refreshRemix error:',err);renderRemix();alert('刷新失败，使用本地默认')}finally{btn.textContent=origText;btn.disabled=false}}

function renderReading(){const books=getStorage(STORAGE_KEYS.readingBooks,[]);if(books.length===0){$('readingList').innerHTML='<div class="empty-state"><div class="icon">📚</div><p>还没有添加书籍</p><p style="font-size:12px">点击上方按钮添加</p></div>';return}$('readingList').innerHTML=books.map((b,i)=>renderBookItem(b,i)).join('')}

function renderBookItem(b,i){let chaptersHtml='';if(b.chapters&&b.chapters.length>0){chaptersHtml='<div class="chapter-list">'+b.chapters.map((c,j)=>`<div class="chapter-item"><span class="chapter-type ${c.type==='intensive'?'chapter-intensive':'chapter-extensive'}">${c.type==='intensive'?'精读':'泛读'}</span><span class="chapter-name">${escapeHtml(c.name)}</span></div>`).join('')+'</div>'}let notesHtml=b.notes?`<div style="margin-top:10px;padding:10px;background:#fafbf7;border-radius:8px;font-size:13px">📝 ${escapeHtml(b.notes)}</div>`:'';return`<div class="reading-book"><div class="book-header"><div class="book-cover">${escapeHtml(b.name.substring(0,2))}</div><div class="book-info"><div class="book-title">${escapeHtml(b.name)}</div><div class="book-progress">📅 已阅读 ${b.streak||0} 天</div><div class="book-progress-bar"><div class="book-progress-fill" style="width:${Math.min(b.progress||0,100)}%"></div></div></div></div>${chaptersHtml}${notesHtml}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-secondary btn-small" onclick="showAddChapterDialog(${i})">➕ 添加章节</button><button class="btn btn-secondary btn-small" onclick="showAddNotesDialog(${i})">📝 添加笔记</button><button class="btn btn-primary btn-small" onclick="updateReadingProgress(${i})">✅ 标记今日已读</button><button class="btn btn-danger btn-small" onclick="deleteBook(${i})">🗑️</button></div></div>`}

function showAddBookDialog(){const modal=$('modalOverlay');const content=$('modalContent');content.innerHTML=`<div class="modal-title">📚 添加书籍</div><div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">书籍名称</label><input class="input" id="bookName" placeholder="例如：深度工作"></div><div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">作者</label><input class="input" id="bookAuthor" placeholder="作者（可选）"></div><div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">每日阅读计划</label><input class="input" id="bookPlan" placeholder="例如：每天读30页"></div><div style="margin-bottom:16px"><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">🤖 AI 生成摘要与规划</label><button class="btn btn-secondary btn-block" onclick="aiGenerateSummary()">✨ 生成粗读+细读摘要</button></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="addBook()">添加（无AI摘要）</button></div>`;modal.classList.add('active')}

function addBook(){const name=$('bookName').value.trim();if(!name){alert('请输入书籍名称');return}const author=$('bookAuthor').value.trim();const plan=$('bookPlan').value.trim();let books=getStorage(STORAGE_KEYS.readingBooks,[]);books.push({name,author,plan,chapters:[],notes:'',streak:0,progress:0,lastRead:null,createdAt:Date.now()});setStorage(STORAGE_KEYS.readingBooks,books);closeModal();renderReading()}

function aiGenerateSummary(){const name=$('bookName').value.trim();if(!name){alert('请先输入书籍名称');return}const author=$('bookAuthor').value.trim()||'未知';const plan=$('bookPlan').value.trim()||'每天读30页';const modal=$('modalOverlay');const content=$('modalContent');content.innerHTML=`<div class="modal-title">🤖 AI 正在生成《${name}》的阅读摘要...</div><div style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:16px">⏳</div><div>正在分析书籍内容...</div></div>`;modal.classList.add('active');setTimeout(()=>{const extensiveSummary=`📖 【粗读摘要】\n\n📌 一句话概括：\n《${name}》是一本关于${inferCategory(name)}的${inferType(name)}，核心观点是${inferCoreView(name)}。\n\n🎯 主要内容：\n• 背景介绍：${inferBackground(name)}\n• 核心论点：${inferArgument(name)}\n• 实用价值：适合${inferTargetReader(name)}\n\n💡 粗读建议：重点关注目录、序言、结语，快速了解框架`;const intensiveSummary=`📚 【细读摘要】\n\n🔍 深度分析：\n\n1️⃣ 核心概念解析\n   ${inferConcepts(name)}\n\n2️⃣ 方法论提炼\n   ${inferMethodology(name)}\n\n3️⃣ 实践应用指南\n   ${inferPracticalGuide(name)}\n\n4️⃣ 关键金句摘录\n   ${inferQuotes(name)}\n\n💡 细读建议：做笔记、画思维导图、联系实际案例`;const chapters=[{name:'序言 / 引言 - 了解背景',type:'extensive'},{name:'第1-2章 核心概念',type:'intensive'},{name:'第3-4章 方法论',type:'intensive'},{name:'第5-6章 实践案例',type:'extensive'},{name:'第7-8章 进阶应用',type:'intensive'},{name:'结语 - 总结回顾',type:'extensive'}];let books=getStorage(STORAGE_KEYS.readingBooks,[]);books.push({name,author,plan,chapters,notes:`【粗读摘要】\n${extensiveSummary}\n\n【细读摘要】\n${intensiveSummary}`,streak:0,progress:0,lastRead:null,createdAt:Date.now()});setStorage(STORAGE_KEYS.readingBooks,books);closeModal();renderReading();showSummaryResult(name,extensiveSummary,intensiveSummary)},1500)}

function showSummaryResult(name,extensive,intensive){const modal=$('modalOverlay');const content=$('modalContent');content.innerHTML=`<div class="modal-title">✨ 《${name}》AI 阅读摘要</div><div style="margin-bottom:16px"><div style="font-size:14px;font-weight:600;margin-bottom:8px">📖 粗读摘要（快速了解）</div><div style="background:#f0f3e8;padding:12px;border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-wrap">${extensive}</div></div><div style="margin-bottom:16px"><div style="font-size:14px;font-weight:600;margin-bottom:8px">📚 细读摘要（深度分析）</div><div style="background:#e8f0f7;padding:12px;border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-wrap">${intensive}</div></div><div style="display:flex;gap:8px"><button class="btn btn-secondary" onclick="copySummary('extensive')">复制粗读</button><button class="btn btn-secondary" onclick="copySummary('intensive')">复制细读</button><button class="btn btn-primary" onclick="closeModal()">完成</button></div>`;modal.classList.add('active')}

function copySummary(type){const books=getStorage(STORAGE_KEYS.readingBooks,[]);const book=books[books.length-1];if(!book||!book.notes)return;const parts=book.notes.split('【细读摘要】');const text=type==='extensive'?parts[0].replace('【粗读摘要】','').trim():(parts[1]||'').trim();navigator.clipboard.writeText(text).then(()=>alert('已复制到剪贴板'))}

function inferCategory(name){const cats={'深度工作':'职场效率','原则':'投资哲学','穷查理宝典':'投资智慧','思考快与慢':'心理学','影响力':'社会心理学','刻意练习':'学习方法','原子习惯':'行为心理学','自控力':'心理学','人生的智慧':'哲学','被讨厌的勇气':'心理学'};for(const k in cats){if(name.includes(k))return cats[k]}return '个人成长与自我提升'}

function inferType(name){const types=['方法论著作','实用指南','传记','哲学思辨','心理学研究','商业案例集'];return types[Math.floor(Math.random()*types.length)]}

function inferCoreView(name){const views=['通过系统化方法提升效率和成果','建立正确的思维模型做决策','理解人性弱点并加以利用','持续学习和刻意练习是成功关键','简化生活，专注当下'];return views[Math.floor(Math.random()*views.length)]}

function inferBackground(name){const bg=['现代社会面临的核心挑战','作者多年研究和实践的结晶','特定领域的经验总结','时代背景下的思想产物'];return bg[Math.floor(Math.random()*bg.length)]}

function inferArgument(name){const args=['提出独特的观点和框架','用大量实证案例支撑论点','构建完整的理论体系','打破常规认知，提供新视角'];return args[Math.floor(Math.random()*args.length)]}

function inferTargetReader(name){const readers=['希望提升自我的职场人士','对相关领域感兴趣的读者','寻求突破的从业者','希望建立系统思维的学习者'];return readers[Math.floor(Math.random()*readers.length)]}

function inferConcepts(name){return '• 核心概念1：详细解释其内涵和外延\n• 核心概念2：与概念1的关系和区别\n• 核心概念3：实际应用场景'}

function inferMethodology(name){return '• 步骤1：基础准备和环境搭建\n• 步骤2：核心技能的习得\n• 步骤3：实践中的迭代优化\n• 步骤4：形成个人风格'}

function inferPracticalGuide(name){return '• 日常应用：如何融入每日工作流\n• 短期目标：1-4周的实践计划\n• 长期愿景：6-12个月的成长路径\n• 常见误区：需要避免的陷阱'}

function inferQuotes(name){return '• "真正的高手，是在正确的时间做正确的事"\n• "效率不是做得更快，而是做得更准"\n• "持续改进比一次性完美更重要"'}

function aiGeneratePlan(){const name=$('bookName').value.trim();if(!name){alert('请先输入书籍名称');return}const chapters=[{name:'序言 / 引言',type:'extensive'},{name:'第1-3章 基础概念',type:'intensive'},{name:'第4-6章 核心方法论',type:'intensive'},{name:'第7-9章 实践案例',type:'extensive'},{name:'第10-12章 进阶技巧',type:'intensive'},{name:'结语',type:'extensive'}];const author=$('bookAuthor').value.trim();const plan=$('bookPlan').value.trim()||'每天读30页';let books=getStorage(STORAGE_KEYS.readingBooks,[]);books.push({name,author,plan,chapters,notes:'',streak:0,progress:0,lastRead:null,createdAt:Date.now()});setStorage(STORAGE_KEYS.readingBooks,books);closeModal();renderReading();alert(`已为《${name}》生成阅读规划！\n重点精读章节已标注`)}

function showAddChapterDialog(bookIdx){const modal=$('modalOverlay');const content=$('modalContent');content.innerHTML=`<div class="modal-title">➕ 添加章节</div><div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">章节名称</label><input class="input" id="chapterName" placeholder="例如：第1章 引言"></div><div style="margin-bottom:16px"><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">章节类型</label><select class="input" id="chapterType"><option value="intensive">重点精读</option><option value="extensive">泛读了解</option></select></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="addChapter(${bookIdx})">添加</button></div>`;modal.classList.add('active')}

function addChapter(bookIdx){const name=$('chapterName').value.trim();const type=$('chapterType').value;if(!name){alert('请输入章节名称');return}let books=getStorage(STORAGE_KEYS.readingBooks,[]);books[bookIdx].chapters=books[bookIdx].chapters||[];books[bookIdx].chapters.push({name,type});setStorage(STORAGE_KEYS.readingBooks,books);closeModal();renderReading()}

function showAddNotesDialog(bookIdx){const modal=$('modalOverlay');const content=$('modalContent');let books=getStorage(STORAGE_KEYS.readingBooks,[]);const book=books[bookIdx];content.innerHTML=`<div class="modal-title">📝 阅读笔记 - ${escapeHtml(book.name)}</div><div style="margin-bottom:16px"><textarea class="input textarea" id="bookNotes" placeholder="记录你的阅读心得、重点摘录...">${escapeHtml(book.notes||'')}</textarea></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveNotes(${bookIdx})">保存</button></div>`;modal.classList.add('active')}

function saveNotes(bookIdx){const notes=$('bookNotes').value.trim();let books=getStorage(STORAGE_KEYS.readingBooks,[]);books[bookIdx].notes=notes;setStorage(STORAGE_KEYS.readingBooks,books);closeModal();renderReading()}

function updateReadingProgress(bookIdx){const today=new Date().toDateString();let books=getStorage(STORAGE_KEYS.readingBooks,[]);const book=books[bookIdx];if(book.lastRead===today){alert('今日已完成阅读！');return}if(book.lastRead){const last=new Date(book.lastRead);const diff=Math.round((new Date(today)-last)/86400000);if(diff===1){book.streak=(book.streak||0)+1}else if(diff>1){book.streak=1}}else{book.streak=1}book.lastRead=today;book.progress=Math.min((book.progress||0)+Math.random()*3+2,100);books[bookIdx]=book;setStorage(STORAGE_KEYS.readingBooks,books);renderReading();alert(`🎉 阅读打卡成功！连续阅读 ${book.streak} 天`)}

function deleteBook(bookIdx){if(!confirm('确定要删除这本书吗？'))return;let books=getStorage(STORAGE_KEYS.readingBooks,[]);books.splice(bookIdx,1);setStorage(STORAGE_KEYS.readingBooks,books);renderReading()}

function getQuote(){let quote=getStorage('wb_quote',null);if(!quote){quote=DEFAULT_QUOTE;setStorage('wb_quote',quote)}return quote}

function renderQuote(){const quote=getQuote();const qText=$('drawerQuoteText');const qAuthor=$('drawerQuoteAuthor');if(qText)qText.textContent=quote.text;if(qAuthor)qAuthor.textContent=quote.author?quote.author:''}

function editCurrentQuote(){const quote=getQuote();const modal=$('modalOverlay');const content=$('modalContent');content.innerHTML=`<div class="modal-title">✏️ 编辑语录</div><div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">语录内容</label><textarea class="input textarea" id="quoteTextInput">${escapeHtml(quote.text)}</textarea></div><div style="margin-bottom:16px"><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">作者（可选）</label><input class="input" id="quoteAuthorInput" value="${escapeHtml(quote.author||'')}"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveCurrentQuote()">保存</button></div>`;modal.classList.add('active')}

function saveCurrentQuote(){const text=$('quoteTextInput').value.trim();const author=$('quoteAuthorInput').value.trim();if(!text){alert('请输入语录内容');return}setStorage('wb_quote',{text,author});closeModal();renderQuote()}

function getQuotes(){return [getQuote()]}

function showRepoConfig(){const config=getStorage(STORAGE_KEYS.repoConfig,{token:''});const modal=$('modalOverlay');const content=$('modalContent');content.innerHTML=`<div class="modal-title">☁️ GitHub 云端同步配置</div><div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">配置后可将数据同步到 GitHub 仓库，多设备共享</div><div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">GitHub Token</label><input class="input" id="repoToken" placeholder="ghp_xxxxxxxxxxxx" value="${escapeHtml(config.token||'')}"></div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:16px;padding:10px;background:#fafbf7;border-radius:8px">💡 <strong>获取方式：</strong><br>1. 打开 github.com/settings/tokens<br>2. 点击 Generate new token，勾选 <code>repo</code> 权限<br>3. 生成后复制 Token 填入</div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveRepoConfig()">保存配置</button></div>`;modal.classList.add('active')}

function saveRepoConfig(){const token=$('repoToken').value.trim();if(!token){alert('请填写 GitHub Token');return}setStorage(STORAGE_KEYS.repoConfig,{token});closeModal();alert('GitHub 配置已保存！')}

async function getFileSha(path,token){try{const resp=await fetch(`https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${path}?ref=${REPO_CONFIG.branch}`,{headers:{'Authorization':`token ${token}`}});if(resp.ok){const data=await resp.json();return data.sha}}catch(e){}return null}

async function syncToRepo(){const config=getStorage(STORAGE_KEYS.repoConfig,null);if(!config||!config.token){alert('请先配置 GitHub Token');showRepoConfig();return}const data={quote:getQuote(),version:'2.0',updatedAt:new Date().toISOString()};try{const sha=await getFileSha(REPO_CONFIG.configFile,config.token);const resp=await fetch(`https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.configFile}`,{method:'PUT',headers:{'Authorization':`token ${config.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`sync config ${Date.now()}`,content:btoa(JSON.stringify(data,null,2)),branch:REPO_CONFIG.branch,...(sha?{sha}:{})})});if(resp.ok){alert('✅ 数据已推送到 GitHub！')}else{const err=await resp.json();alert('❌ 推送失败：'+(err.message||'未知错误'))}}catch(e){alert('❌ 网络错误：'+e.message)}}

async function syncFromRepo(){const config=getStorage(STORAGE_KEYS.repoConfig,null);if(!config||!config.token){alert('请先配置 GitHub Token');showRepoConfig();return}try{const resp=await fetch(`https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.configFile}?ref=${REPO_CONFIG.branch}`,{headers:{'Authorization':`token ${config.token}`}});if(resp.ok){const file=await resp.json();const data=JSON.parse(atob(file.content));if(data.quote){setStorage('wb_quote',data.quote);renderQuote()}else if(data.quotes&&data.quotes.length>0){setStorage('wb_quote',data.quotes[0]);renderQuote()}alert('✅ 已从 GitHub 同步数据！')}else{alert('拉取失败')}}catch(e){alert('❌ 网络错误：'+e.message)}}

function showSyncMenu(){const modal=$('modalOverlay');const content=$('modalContent');const config=getStorage(STORAGE_KEYS.repoConfig,null);const configured=config&&config.token;content.innerHTML=`<div class="modal-title">☁️ 数据同步</div><div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">将本地数据与 GitHub 仓库云端同步</div><div style="margin-bottom:12px"><div style="font-size:12px;margin-bottom:8px">GitHub 状态：${configured?'<span style="color:#4a4">✓ 已配置</span>':'<span style="color:#d44">✗ 未配置</span>'}</div><button class="btn btn-secondary btn-block" onclick="showRepoConfig()">⚙️ ${configured?'修改配置':'配置 GitHub'}</button></div><div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn btn-primary" onclick="syncToRepo()" ${configured?'':'disabled style=opacity:0.5'}>📤 推送到云端</button><button class="btn btn-secondary" onclick="syncFromRepo()" ${configured?'':'disabled style=opacity:0.5'}>📥 从云端拉取</button></div><div style="font-size:12px;color:var(--text-secondary);padding:10px;background:#fafbf7;border-radius:8px;margin-bottom:12px">💡 同步内容：语录配置（热榜数据由 GitHub Actions 自动更新）</div><button class="btn btn-secondary btn-block" onclick="closeModal()">关闭</button>`;modal.classList.add('active')}

window.addEventListener('load', () => {
navigator.serviceWorker.register('./service-worker.js')
.then(() => console.log('SW registered'))

});

window.addEventListener('load', async function(){
try{const hotData=await fetchHotDataFromRepo();if(hotData){if(hotData.inspiration){setStorage('wb_inspiration_cache',hotData.inspiration);renderInspiration();console.log('✅ 热榜灵感已同步')}if(hotData.remix){setStorage('wb_remix_cache',hotData.remix);renderRemix();console.log('✅ 热榜二创已同步')}console.log('📊 热榜数据同步完成')}}catch(e){console.log('⚠️ 热榜数据同步失败（不影响使用）:',e.message)}
try{const config=getStorage(STORAGE_KEYS.repoConfig,null);if(config&&config.token){console.log('📥 正在从 GitHub 自动同步配置...');const resp=await fetch(`https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.configFile}?ref=${REPO_CONFIG.branch}`,{headers:{'Authorization':`token ${config.token}`}});if(resp.ok){const file=await resp.json();const data=JSON.parse(atob(file.content));if(data.quote){setStorage('wb_quote',data.quote);renderQuote();console.log('✅ 语录已同步')}else if(data.quotes&&data.quotes.length>0){setStorage('wb_quote',data.quotes[0]);renderQuote();console.log('✅ 语录已同步(兼容旧格式)')}console.log('📊 GitHub 配置同步完成')}}}catch(e){console.log('⚠️ GitHub 配置同步失败（不影响使用）:',e.message)}});
</script>
